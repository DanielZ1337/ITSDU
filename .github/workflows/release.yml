
name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    name: Detect new version
    runs-on: ubuntu-latest

    outputs:
      should_release: ${{ steps.version.outputs.should_release }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check package version
        id: version
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)

          if git cat-file -e "${BEFORE_SHA}:package.json" 2>/dev/null; then
            PREVIOUS_VERSION=$(
              git show "${BEFORE_SHA}:package.json" |
              jq -r '.version'
            )
          else
            PREVIOUS_VERSION=""
          fi

          echo "Previous version: $PREVIOUS_VERSION"
          echo "Current version:  $CURRENT_VERSION"

          if [ "$CURRENT_VERSION" = "$PREVIOUS_VERSION" ]; then
            echo "Version unchanged. Skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ ! "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: $CURRENT_VERSION"
            exit 1
          fi

          TAG="v${CURRENT_VERSION}"

          echo "New release detected: $TAG"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release
    needs: prepare

    if: needs.prepare.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  tag:
    name: Create release tag
    needs:
      - prepare
      - verify

    if: needs.prepare.outputs.should_release == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"

          if git show-ref --verify --quiet "refs/tags/$TAG"; then

            EXISTING_COMMIT=$(
              git rev-list -n 1 "refs/tags/$TAG"
            )

            if [ "$EXISTING_COMMIT" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already exists on another commit."
              echo "Existing: $EXISTING_COMMIT"
              echo "Expected: $GITHUB_SHA"
              exit 1
            fi

            echo "Tag $TAG already points to this commit."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              tag -a "$TAG" "$GITHUB_SHA" \
              -m "Release $TAG"

          git push origin "refs/tags/$TAG"

          echo "Created release tag: $TAG"

  release:
    name: Build and publish ${{ matrix.platform }}

    needs:
      - prepare
      - tag

    if: needs.prepare.outputs.should_release == 'true'

    runs-on: ${{ matrix.os }}

    environment: release

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            script: release:mac

          - platform: Linux
            os: ubuntu-latest
            script: release:linux

          - platform: Windows
            os: windows-2022
            script: release:win

    steps:
      - name: Checkout release
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"

      - name: Build and publish
        run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GYP_MSVS_VERSION: "2022"
          npm_config_msvs_version: "2022"
          VITE_ITSLEARNING_STORE_KEY: ${{ secrets.VITE_ITSLEARNING_STORE_KEY }}
          VITE_ITSLEARNING_OAUTH_STATE: ${{ secrets.VITE_ITSLEARNING_OAUTH_STATE }}